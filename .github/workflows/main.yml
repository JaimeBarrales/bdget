name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    name: Test, Coverage & Build Jar
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Checkout del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # Paso 2: Configurar JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Paso 3: Cache de dependencias de Maven
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      # Paso 4: Ejecutar pruebas y generar reporte JaCoCo
      - name: Run tests with JaCoCo
        run: ./mvnw clean verify

      # Paso 5: Construir el JAR
      - name: Build Jar
        run: ./mvnw clean package -DskipTests

      # Paso 6: Upload reporte de cobertura JaCoCo
      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v3
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # Paso 7: Upload JAR artifact
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-jar
          path: target/*.jar
